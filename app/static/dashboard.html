<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<title>Sharma Cafe — WhatsApp Agent Dashboard</title>
<style>
  :root{
    --bg:#0b1120; --bg2:#111827; --card:#151d2e; --card2:#1b2537; --line:#26314a;
    --txt:#e8eef8; --muted:#93a2bd; --green:#22c55e; --green2:#16a34a; --amber:#f59e0b;
    --red:#ef4444; --blue:#3b82f6; --purple:#a855f7; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:14px}
  a{color:var(--blue)}
  button{font-family:inherit}
  .app{display:flex;min-height:100vh}
  /* ---------- sidebar ---------- */
  .side{width:216px;flex:0 0 216px;background:linear-gradient(180deg,#0e1626,#0b1120);
    border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#22c55e,#0ea5e9);
    display:grid;place-items:center;font-size:20px}
  .brand h1{font-size:15px;margin:0;line-height:1.2}
  .brand div small{color:var(--muted);font-size:11px}
  .nav{margin-top:16px;display:flex;flex-direction:column;gap:3px}
  .nav button{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;color:var(--muted);
    padding:9px 11px;border-radius:10px;cursor:pointer;font-size:13.5px;text-align:left}
  .nav button:hover{background:#162034;color:var(--txt)}
  .nav button.on{background:linear-gradient(90deg,#1d293f,#16233a);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
  .nav .ico{width:18px;text-align:center}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
  .modes{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    background:#101a2c;border:1px solid var(--line);border-radius:999px;padding:3px 9px;width:max-content}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .dot.warn{background:var(--amber)} .dot.live{background:var(--green)} .dot.demo{background:var(--amber)}
  /* ---------- main ---------- */
  .main{flex:1;min-width:0;padding:18px 22px 60px}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .topbar h2{margin:0;font-size:19px}
  .topbar .sub{color:var(--muted);font-size:12.5px}
  .grow{flex:1}
  .btn{background:#1c2740;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 13px;
    cursor:pointer;font-size:13px}
  .btn:hover{border-color:#3a4a6d}
  .btn.primary{background:linear-gradient(135deg,var(--green),var(--green2));border:0;color:#06240f;font-weight:600}
  .btn.amber{background:#3a2a09;border-color:#5b4310;color:#fbbf24}
  .btn.red{background:#3a1414;border-color:#5b2020;color:#fca5a5}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
  .card h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
  .kpi{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .kpi small{font-size:12px;color:var(--muted);font-weight:500}
  .two{grid-template-columns:1.35fr 1fr}
  .three{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
    padding:7px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid #1c2437;vertical-align:top}
  tr:hover td{background:#162034}
  .pill{display:inline-block;font-size:11px;padding:2.5px 8px;border-radius:999px;background:#1c2740;color:var(--muted)}
  .pill.paid,.pill.p-ok{background:#0c2c1a;color:#4ade80}
  .pill.pending,.pill.p-warn{background:#3a2a09;color:#fbbf24}
  .pill.cod{background:#0f2a3d;color:#60a5fa}
  .pill.bad{background:#3a1414;color:#fca5a5}
  .pill.good{background:#0c2c1a;color:#4ade80}
  .muted{color:var(--muted)}
  .tiny{font-size:11.5px}
  input,textarea,select{background:#0f1728;border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 11px;font-family:inherit;font-size:13px;width:100%}
  input:focus,textarea:focus,select:focus{outline:1px solid #33507e}
  label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row > *{flex:1;min-width:110px}
  .row .fix{flex:0 0 auto;min-width:0}
  .bars{display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:6px}
  .bars div{flex:1;background:linear-gradient(180deg,#22c55e,#0e7490);border-radius:4px 4px 0 0;min-height:3px;position:relative}
  .bars div span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}
  /* ---------- chat ---------- */
  .chat{display:grid;grid-template-columns:270px 1fr;gap:14px;height:calc(100vh - 150px)}
  .threads{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
  .thread{padding:10px 12px;border-bottom:1px solid #1c2437;cursor:pointer}
  .thread:hover{background:#162034}
  .thread.on{background:#1b2740;box-shadow:inset 3px 0 0 var(--green)}
  .thread b{font-size:13px} .thread p{margin:2px 0 0;color:var(--muted);font-size:11.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chatbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0}
  .chathead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:9px;background:
    radial-gradient(1200px 400px at 20% -10%,#132033,transparent)}
  .b{max-width:74%;padding:9px 12px;border-radius:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;font-size:13.5px}
  .b.out{background:#0f3a24;border:1px solid #17512f;align-self:flex-end;border-bottom-right-radius:4px}
  .b.in{background:#1c2437;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .b .meta{display:block;margin-top:5px;font-size:10px;color:#7f8ea8}
  .compose{border-top:1px solid var(--line);padding:11px;display:flex;gap:9px;align-items:flex-end}
  .compose textarea{resize:none;height:44px}
  .suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 11px 11px}
  .suggest button{background:#162034;border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:5px 11px;font-size:11.5px;cursor:pointer}
  .suggest button:hover{color:var(--txt);border-color:#3a4a6d}
  .toast{position:fixed;right:18px;bottom:18px;background:#152238;border:1px solid var(--line);border-left:3px solid var(--green);
    padding:12px 16px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:340px;display:none;z-index:50}
  .toast.err{border-left-color:var(--red)}
  .empty{color:var(--muted);text-align:center;padding:26px;font-size:13px}
  pre{background:#0d1524;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;
    font-size:12px;line-height:1.5;white-space:pre-wrap}
  .stars{color:var(--amber);letter-spacing:1px}
  .divider{height:1px;background:var(--line);margin:14px 0}
  @media (max-width:900px){
    .app{flex-direction:column}
    .side{width:auto;flex:none;height:auto;position:static;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .nav{flex-direction:row;flex-wrap:wrap;margin-top:8px}
    .two,.chat{grid-template-columns:1fr}
    .chat{height:auto}
    .msgs{height:52vh}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">🍽️</div>
      <div>
        <h1 id="brandName">Sharma Cafe</h1>
        <small id="agentName">Bablu • Digital Waiter</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="modes" id="modeChips"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Overview</h2>
        <div class="sub" id="pageSub">—</div>
      </div>
      <div class="grow"></div>
      <button class="btn" onclick="refresh()">↻ Refresh</button>
      <button class="btn amber" onclick="runAutomation()">⚡ Run due tasks</button>
      <button class="btn" onclick="setAdminToken()" title="Dashboard admin token (session me save hota hai)">🔑 Token</button>
      <button class="btn red" onclick="resetDemo()" title="Sirf demo/development mode me chalta hai">🧪 Reset demo data</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================ helpers ============================ */
const qs = new URLSearchParams(location.search);
// Admin token: sirf sessionStorage me, sirf header me bheja jata hai (URL me kabhi nahi — logs/history me leak na ho)
if (qs.get("token")) {  // purana link (?token=) — token uthao aur URL se hata do
  sessionStorage.setItem("adminToken", qs.get("token"));
  const clean = new URL(location.href); clean.searchParams.delete("token"); history.replaceState(null, "", clean.toString());
}
let TOKEN = sessionStorage.getItem("adminToken") || "";
function setAdminToken(){
  const t = prompt("Dashboard admin token daalein (ADMIN_TOKEN jo .env me hai):", TOKEN || "");
  if (t === null) return;
  TOKEN = t.trim(); if (TOKEN) sessionStorage.setItem("adminToken", TOKEN); else sessionStorage.removeItem("adminToken");
  refresh();
}
const PAGE = qs.get("page") || "overview";
const TABS = [
  ["overview","📊","Overview"],["chat","💬","Live Chat"],["orders","🧾","Orders"],["menu","📖","Menu"],
  ["customers","🧠","Memory"],["offers","🎁","Offers"],["campaigns","📣","Campaigns"],["reservations","📅","Table Booking"],
  ["feedback","⭐","Feedback"],["alerts","🚨","Alerts"],["automation","🤖","Automation"],["settings","⚙️","Settings"],
];
let STATE = { page: PAGE, summary: null, chatPhone: qs.get("phone") || "919876543210", chatName: null, alerts: 0 };

function api(path, opts={}){
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if (TOKEN) headers["X-Admin-Token"] = TOKEN;
  return fetch(path, Object.assign({}, opts, {headers}))
    .then(async r => { const t = await r.text(); let d; try { d = t? JSON.parse(t): null } catch(e){ d = t }
      if(!r.ok){
        const detail = (d && d.detail) ? (typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail)) : ("HTTP "+r.status);
        if (r.status === 401) throw new Error(detail + " — upar 🔑 Token se sahi token daalein");
        throw new Error(detail);
      }
      return d; });
}
function toast(msg, err=false){
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = "toast" + (err?" err":""); el.style.display="block";
  clearTimeout(el._t); el._t = setTimeout(()=>el.style.display="none", 4200);
}
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs  = n => "₹" + Number(n||0).toLocaleString("en-IN", {maximumFractionDigits:0});
const rs2 = n => "₹" + Number(n||0).toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2});
const stars = n => "★".repeat(Number(n)||0) + "☆".repeat(Math.max(0,5-(Number(n)||0)));
function go(page){ STATE.page = page; const u = new URL(location); u.searchParams.set("page", page); history.replaceState(null,"",u); render(); }
function link(page){ const u = new URL(location); u.searchParams.set("page", page); location.href = u.toString(); }

/* ============================ chrome ============================ */
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = TABS.map(([id,ico,label])=>`
    <button class="${STATE.page===id?"on":""}" onclick="go('${id}')">
      <span class="ico">${ico}</span>${label}
      ${id==="alerts" && STATE.alerts ? `<span class="badge">${STATE.alerts}</span>` : ""}
    </button>`).join("");
}

function renderModes(){
  const m = STATE.summary?.modes || {};
  const chip = (label, live, text) => `<span class="chip"><span class="dot ${live?"live":"demo"}"></span>${label}: ${esc(text)}</span>`;
  document.getElementById("modeChips").innerHTML = [
    chip("WhatsApp", m.whatsapp_live, m.whatsapp_live? "Live API" : "Mock (demo)"),
    chip("AI", m.llm_live, m.llm_live? esc(m.llm_model||"live") : "Built-in brain"),
    chip("Payment", m.payment_live, m.payment_live? "Razorpay" : "Mock page"),
    chip("DB", false, esc(m.database||"—")),
    chip("GST", false, (m.gst_percent??0)+"%"),
    chip("Automation", m.automation_enabled, m.automation_enabled? "ON" : "OFF"),
  ].join("");
}

/* ============================ pages ============================ */
async function viewOverview(){
  const s = await api("/api/summary"); STATE.summary = s;
  const t = s.today, w = s.week;
  const maxOrders = Math.max(1, ...(t.hourly||[]).map(h=>h.orders));
  const bars = (t.hourly||[]).map(h=>`<div style="height:${Math.max(3,(h.orders/maxOrders)*100)}%" title="${h.hour}:00 — ${h.orders} orders"><span>${h.hour}</span></div>`).join("");
  const kpis = [
    ["Aaj ki sale", rs(t.sales), `${t.paid_orders} paid / ${t.orders} order`],
    ["Avg bill", rs(t.avg_order_value), `${t.orders} orders aaj`],
    ["Naye customer", t.new_customers, `Total memory: ${s.customers}`],
    ["Pending payment", rs(t.pending_amount), `${s.pending_orders} order pending`],
    ["Rating", (t.avg_rating||"—")+" / 5", `${t.feedback_count} feedback aaj`],
    ["Table booking", t.reservations, `${s.upcoming_reservations} aane wali`],
    ["Discount diya", rs(t.discount_given), "rule engine se, AI se nahi"],
    ["Alerts", s.open_alerts, t.complaints? `${t.complaints} complaint aaj` : "sab theek hai"],
  ];
  return `
  <div class="grid cards">
    ${kpis.map(([l,v,s2])=>`<div class="card"><h3>${l}</h3><div class="kpi">${v}</div><div class="tiny muted">${esc(s2)}</div></div>`).join("")}
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card">
      <h3>Ghnte ke hisaab se orders (IST)</h3>
      <div class="bars">${bars}</div>
    </div>
    <div class="card">
      <h3>Sabse zyada bika aaj</h3>
      ${(t.top_items.length? `<table><tbody>${t.top_items.map(([name,qty])=>`<tr><td>${esc(name)}</td><td style="text-align:right" class="muted">${qty}x</td></tr>`).join("")}</tbody></table>`
        : `<div class="empty">Aaj abhi koi order nahi — Live Chat se ek order karke dekho 😄</div>`)}
      <div class="divider"></div>
      <h3>Hafte ka hisaab</h3>
      <div class="tiny">Sale: <b>${rs(w.sales)}</b> • Orders: <b>${w.orders}</b> • Naye customer: <b>${w.new_customers}</b> • Rating: <b>${w.avg_rating||"—"}</b></div>
    </div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card">
      <h3>Latest orders</h3>
      <table><thead><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Kab</th></tr></thead>
      <tbody>${(s.recent_orders||[]).map(o=>`<tr>
        <td>${esc(o.order_no)}</td><td>${esc(o.name||o.phone)}</td>
        <td class="tiny muted">${esc(o.items_text)}</td><td>${rs(o.total)}</td>
        <td><span class="pill ${o.payment_status}">${esc(o.payment_status)}</span></td>
        <td><span class="pill">${esc(o.order_status)}</span></td><td class="tiny muted">${esc(o.at||"")}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <div class="card">
      <h3>Owner ke alerts</h3>
      ${(s.recent_alerts||[]).map(a=>`<div style="padding:8px 0;border-bottom:1px solid #1c2437">
        <span class="pill ${a.kind==="complaint"?"bad":"good"}">${esc(a.kind)}</span>
        <div class="tiny" style="margin-top:5px;white-space:pre-wrap">${esc(a.message)}</div>
        <div class="tiny muted">${esc(a.at||"")}</div></div>`).join("") || `<div class="empty">Koi alert nahi 🎉</div>`}
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>Aaj ki owner report (jo WhatsApp par jaati hai)</h3>
    <pre>${esc((await api("/api/reports/daily")).text)}</pre>
  </div>`;
}

async function viewChat(){
  const convs = await api("/api/conversations");
  const threads = convs.map(c=>`<div class="thread ${c.phone===STATE.chatPhone?"on":""}" onclick="openChat('${c.phone}','${esc(c.name||"")}')">
      <b>${esc(c.name || c.phone)}</b>${c.human_mode? ' <span class="pill bad">staff</span>':''}
      <p>${c.direction==="in"?"👤 ":"🤖 "}${esc(c.last_message)}</p>
      <p class="tiny">${esc(c.at||"")}</p></div>`).join("") || `<div class="empty">Abhi koi chat nahi</div>`;
  const chat = await api("/api/messages/"+encodeURIComponent(STATE.chatPhone));
  const msgs = chat.messages.map(m=>`<div class="b ${m.direction==="in"?"in":"out"}">${esc(m.text)}
      <span class="meta">${m.direction==="in"?"Customer":"Bablu"} • ${esc(m.at||"")}${m.intent? " • "+esc(m.intent):""}</span></div>`).join("")
      || `<div class="empty">Yahan se message bhej ke agent ko test karo 👇</div>`;
  const outbox = await api("/api/outbox?limit=6");
  return `
  <div class="chat">
    <div class="threads">
      <div style="padding:11px 12px;border-bottom:1px solid var(--line)">
        <label>Naya number par chat</label>
        <div class="row"><input id="newPhone" placeholder="9198…" value="${esc(STATE.chatPhone)}">
        <button class="btn fix sm" onclick="openChat(document.getElementById('newPhone').value,'')">Open</button></div>
      </div>
      ${threads}
    </div>
    <div class="chatbox">
      <div class="chathead">
        <b>${esc(chat.name || STATE.chatName || chat.phone)}</b>
        <span class="tiny muted">${esc(chat.phone)}</span>
        <div class="grow"></div>
        <button class="btn sm ${chat.human_mode?"amber":""}" onclick="toggleHuman('${chat.phone}',${chat.human_mode?0:1})">
          ${chat.human_mode? "🤝 Human mode ON (agent chup)" : "🤝 Hand over to staff"}</button>
      </div>
      <div class="msgs" id="msgs">${msgs}</div>
      <div class="suggest">
        ${["hi","menu bhejo","2 paneer butter masala, 4 butter naan","aaj shaam 7 baje 4 logo ki table book karni hai","kuch achha batao","mera naam Rahul hai","5","stop","insaan se baat karni hai","aaj ki sale batado"]
          .map(s=>`<button onclick="fill('${esc(s)}')">${esc(s)}</button>`).join("")}
      </div>
      <div class="compose">
        <textarea id="chatInput" placeholder="Customer ki tarah likho… (Enter = bhejo)"></textarea>
        <button class="btn primary fix" onclick="sendChat()">Bhejo ➤</button>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>Outbox — mock mode me yahan "bheja" gaya</h3>
    <table><tbody>${outbox.reverse().map(o=>`<tr><td class="tiny">${esc(o.to)}</td><td class="tiny muted">${esc((o.payload&&o.payload.body)||o.kind)}</td>
      <td class="tiny"><span class="pill ${o.ok?"good":"bad"}">${o.mode}</span></td></tr>`).join("") || `<tr><td class="muted tiny">Kuch nahi</td></tr>`}</tbody></table>
  </div>`;
}

function openChat(phone, name){ STATE.chatPhone = phone; STATE.chatName = name; render(); }
function fill(text){ document.getElementById("chatInput").value = text; document.getElementById("chatInput").focus(); }

async function sendChat(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim(); if(!text) return;
  input.value=""; input.disabled=true;
  try{
    const res = await api("/api/simulate", {method:"POST", body:JSON.stringify({phone: STATE.chatPhone, text})});
    if (res.replies && res.replies.length) toast("Agent ne reply bhej diya ("+res.intent+")");
    else toast("Message process hua ("+res.intent+")");
    await render();
    const el = document.getElementById("msgs"); if(el) el.scrollTop = el.scrollHeight;
  }catch(e){ toast("Error: "+e.message, true); }
  input.disabled=false; input.focus();
}

async function toggleHuman(phone, on){
  await api("/api/customers/"+encodeURIComponent(phone), {method:"PATCH", body: JSON.stringify({human_mode: !!on})});
  toast(on? "Human mode ON — ab agent reply nahi karega" : "Human mode OFF — agent wapas sambhal lega");
  render();
}

async function viewOrders(){
  const orders = await api("/api/orders?limit=120");
  const rows = orders.map(o=>`<tr>

    ${rows.map(a=>`<div style="padding:11px 0;border-bottom:1px solid #1c2437;display:flex;gap:11px">
      <div style="flex:0 0 auto"><span class="pill ${a.kind==="complaint"?"bad": a.kind==="payment"?"good":"pending"}">${esc(a.kind)}</span></div>
      <div style="flex:1;white-space:pre-wrap" class="tiny">${esc(a.message)}<div class="tiny muted">${esc(a.at||"")} ${a.phone? "• "+esc(a.phone):""} ${a.is_read?"• padh liya":""}</div></div>
      ${a.is_read? "": `<button class="btn sm fix" style="align-self:flex-start" onclick="readOne(${a.id})">✓</button>`}
    </div>`).join("") || `<div class="empty">Koi alert nahi 🎉</div>`}
  </div>`;
}
async function readOne(id){ await api("/api/alerts/"+id+"/read", {method:"POST"}); render(); }
async function readAll(){ await api("/api/alerts/read-all", {method:"POST"}); toast("Sab alerts padh liye"); render(); }

async function viewAutomation(){
  const [status] = await Promise.all([api("/api/automations/status")]);
  const steps = [
    ["🎂","Roz 9 bajे","Birthday wish + free dessert coupon (F11)"],
    ["👨‍🍳","Har 45 sec","Order status aage: confirmed → preparing → packed → rider → delivered (F10)"],
    ["⭐","1 ghante baad","Delivered order par feedback maangna (F14)"],
    ["📅","1 ghanta pehle","Table booking ka reminder (F9)"],
    ["💌","Roz 8 baje","30+ din gayab customers ko winback 20% OFF (F12) — sirf opt-in"],
    ["📊","Raat 11 baje","Owner ko daily report WhatsApp par (F19)"],
  ];
  return `
  <div class="grid cards">
    <div class="card"><h3>Automation</h3><div class="kpi">${status.automation_enabled? "ON":"OFF"}</div>
      <div class="tiny muted">Scheduler har ${status.scheduler_interval_seconds}s chalता hai</div></div>
    <div class="card"><h3>Owner report time</h3><div class="kpi">${esc(status.owner_report_time)}</div><div class="tiny muted">IST</div></div>
    <div class="card"><h3>Birthday time</h3><div class="kpi">${esc(status.birthday_time)}</div><div class="tiny muted">IST</div></div>
    <div class="card"><h3>Winback after</h3><div class="kpi">${status.winback_days}d</div><div class="tiny muted">Limit: ${status.proactive_limit_per_day}/din</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>Agent khud kya-kya karta hai</h3>
    <table><tbody>${steps.map(([i,w,t])=>`<tr><td style="width:34px;font-size:18px">${i}</td>
      <td style="width:150px" class="tiny">${esc(w)}</td><td class="tiny">${esc(t)}</td></tr>`).join("")}</tbody></table>
    <div class="divider"></div>
    <h3>Kitchen pipeline (minute = order ke kitne minute baad)</h3>
    <div class="row">${(status.pipeline||[]).map(([s,m])=>`<div class="chip"><span class="dot live"></span>${esc(s)} @ ${m} min</div>`).join("")}</div>
    <div class="divider"></div>
    <button class="btn primary" onclick="runAutomation()">⚡ Abhi saare due tasks chalao</button>
    <div class="tiny muted" style="margin-top:8px">Dobara chalane par wahi message dobara nahi jaata (idempotent) — spam control.</div>
  </div>`;
}

async function viewSettings(){
  const s = await api("/api/settings");
  return `
  <div class="grid two">
    <div class="card">
      <h3>System Prompt (AI ka character — Bablu)</h3>
      <pre>${esc(s.prompt)}</pre>
      <div class="tiny muted">Isi prompt se AI funny + respectful rehta hai, aur price/discount ke number chhoona uske liye mana hai.</div>
    </div>
    <div class="card">
      <h3>Live modes</h3>
      <table><tbody>
        ${Object.entries(s.modes).map(([k,v])=>`<tr><td class="tiny muted">${esc(k)}</td><td class="tiny"><b>${esc(String(v))}</b></td></tr>`).join("")}
      </tbody></table>
      <div class="divider"></div>
      <h3>Restaurant profile</h3>
      <div class="row">
        <div><label>Naam</label><input value="${esc(s.restaurant.name)}" disabled></div>
        <div><label>Hours</label><input value="${esc(s.restaurant.hours)}" disabled></div>
      </div>
      <label style="margin-top:9px">Google review link</label>
      <input id="stReview" value="${esc(s.restaurant.google_review_link||"")}" placeholder="https://g.page/r/…/review">
      <label style="margin-top:9px">Agent persona extra (mood/style)</label>
      <textarea id="stPersona" rows="3">${esc(s.agent.persona_extra||"")}</textarea>
      <button class="btn primary" style="margin-top:10px" onclick="saveSettings()">Save</button>
      <div class="divider"></div>
      <h3>Live karne ke liye (.env me badlo)</h3>
      <div class="tiny muted">WHATSAPP_MODE=live + token, LLM_MODE=auth + API key, PAYMENT_MODE=live + Razorpay keys. Baaki sab yahi ke yahi chalega — code badalne ki zarurat nahi.</div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>WhatsApp Graph API payload (jo server bhejta hai)</h3>
    <pre>${esc((await api("/api/demo/whatsapp-payload")).payload)}</pre>
    <div class="tiny muted">Live mode me yahi request graph.facebook.com par jaati hai (token ke saath).</div>
  </div>`;
}
async function saveSettings(){
  try{
    await api("/api/settings", {method:"PUT", body: JSON.stringify({
      restaurant: {google_review_link: stReview.value}, agent: {persona_extra: stPersona.value}})});
    toast("Settings save ho gayi"); render();
  }catch(e){ toast(e.message,true); }
}

/* ============================ router ============================ */
const PAGES = {
  overview: viewOverview, chat: viewChat, orders: viewOrders, menu: viewMenu, customers: viewCustomers,
  offers: viewOffers, campaigns: viewCampaigns, reservations: viewReservations, feedback: viewFeedback,
  alerts: viewAlerts, automation: viewAutomation, settings: viewSettings,
};
const TITLES = {
  overview:["Overview","Aaj ka business ek nazar me"], chat:["Live Chat","Agent se baat karo — asli WhatsApp jaisa pipeline"],
  orders:["Orders","Bill, payment link, kitchen status"], menu:["Menu","Item, price, availability"],
  customers:["Memory","Har customer ki file — naam, pasand, notes, points"], offers:["Offers & Rules","Discount ka faisla rule karta hai, AI nahi"],
  campaigns:["Campaigns","Birthday, winback, broadcast — permission ke saath"], reservations:["Table Booking","Booking + reminder"],
  feedback:["Feedback","Rating, Google review, complaint alert"], alerts:["Alerts","Owner ko turant khabar"],
  automation:["Automation","Jo kaam agent khud karta hai"], settings:["Settings","Modes, prompt, profile"],
};

async function render(){
  renderNav();
  const title = TITLES[STATE.page] || TITLES.overview;
  document.getElementById("pageTitle").textContent = title[0];
  document.getElementById("pageSub").textContent = title[1];
  const view = document.getElementById("view");
  view.innerHTML = `<div class="empty">Load ho raha hai…</div>`;
  try{
    view.innerHTML = await PAGES[STATE.page]();
    if(STATE.page==="chat"){ const m=document.getElementById("msgs"); if(m) m.scrollTop=m.scrollHeight;
      const input=document.getElementById("chatInput");
      if(input) input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); }});
      input && input.focus(); }
  }catch(e){
    view.innerHTML = `<div class="card"><h3>Problem aa gayi</h3><pre>${esc(e.message)}</pre>
      <div class="tiny muted">Server chal raha hai? <code>uvicorn app.main:app --host 0.0.0.0 --port 8000</code></div></div>`;
  }
}
async function refresh(){ try{ STATE.summary = await api("/api/summary"); STATE.alerts = STATE.summary.open_alerts; }catch(e){} render(); }
async function runAutomation(){
  try{ const r = await api("/api/automations/run?force=true", {method:"POST"});
    const t = r.tasks||{}; toast(`Automation chala: ${Object.keys(t).join(", ")||"kuch due nahi tha"}`); render(); }
  catch(e){ toast(e.message,true); }
}
async function resetDemo(){
  if(!confirm("Poora data delete karke naya demo banega. Theek hai?")) return;
  try{ await api("/api/demo/reset", {method:"POST"}); toast("Demo data reset ho gaya"); refresh(); }catch(e){ toast(e.message,true); }
}

(async function boot(){
  await refresh();
  const s = STATE.summary || {};
  document.getElementById("brandName").textContent = s.restaurant || "Restaurant Agent";
  document.getElementById("agentName").textContent = (s.agent || "Agent") + " • Digital Waiter";
})();
</script>
</body>
</html>
